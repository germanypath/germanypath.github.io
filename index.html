<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GermanyPath</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f6b4a; color: #fff; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .box { padding: 16px; width: 100%; max-width: 360px; }
  h1 { margin: 0 0 24px; }
  a { display: block; background: #f4c430; color: #1d2420; font-weight: 700; text-decoration: none;
    padding: 15px; border-radius: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="box">
  <h1>GermanyPath</h1>
  <a id="fr" href="fr/">Français</a>
  <a id="en" href="en/">English</a>
</div>
<script>
  // Kanal-Code weiterreichen und Sprache des Handys automatisch wählen
  var q = location.search;
  document.getElementById("fr").href += q;
  document.getElementById("en").href += q;
  var lang = (navigator.language || "").toLowerCase();
  if (lang.indexOf("fr") === 0) location.replace("fr/" + q);
  else if (lang.indexOf("en") === 0) location.replace("en/" + q);
</script>
</body>
</html>
